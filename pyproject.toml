[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guardrails"
version = "0.1.0"
description = "Stop coding agents from breaking your team's recorded decisions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
guard = "guard.cli:main"

[tool.setuptools]
packages = ["guard"]
